            <script>
            // Поставь свою дату здесь
            const startDate = new Date("2007-12-24T12:00:00");

            function updateTimer() {
                const now = new Date();
                let diff = now - startDate;

                if (diff < 0) diff = 0; // на случай ошибки

                // Пересчёт в единицы
                const sec = Math.floor(diff / 1000);
                const min = Math.floor(sec / 60);
                const hour = Math.floor(min / 60);
                const day = Math.floor(hour / 24);

                // Грубый пересчёт месяцев/лет (календарная точность требует сложнее)
                const years = Math.floor(day / 365);
                const months = Math.floor((day % 365) / 30);
                const days = (day % 365) % 30;

                const hours = hour % 24;
                const minutes = min % 60;
                const seconds = sec % 60;

                document.getElementById("timer").textContent = 
                    `\u2003 Тоесть мне сейчас примерно... ${years} лет, ${months} месяцев, ${days} дней, ` +
                    `${hours} часов, ${minutes} минут, ${seconds} секунд.`;
            }

            setInterval(updateTimer, 1000);
            updateTimer();
            </script>
